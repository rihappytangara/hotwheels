<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário com Foto</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 20px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .aviso {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Formulário de Envio</h1>

    <form 
      action="https://submify.vercel.app/rihappy.tangara@gmail.com" 
      method="POST" 
      enctype="multipart/form-data"
    >
      <label for="nome">Nome Completo</label>
      <input 
        type="text" 
        id="nome" 
        name="nome_completo" 
        required 
      />

      <label for="telefone">Telefone para contato</label>
      <input 
        type="tel" 
        id="telefone" 
        name="telefone_contato" 
        required 
      />

      <label for="foto">Foto</label>
      <input 
        type="file" 
        id="foto" 
        name="foto" 
        accept="image/*" 
        required 
      />

      <p class="aviso">
        Os três campos são obrigatórios.
      </p>

      <button type="submit">Enviar</button>
    </form>
  </div>
</body>
</html>
